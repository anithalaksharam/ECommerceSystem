version: '3.8'

services:
  test-sql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: test-sql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!

  test-identity-api:
    image: identity-service:v1
    container_name: test-identity-api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Use the exact key matching your code here:
      - ConnectionStrings__SqlConnection=Server=test-sql;Database=IdentityDb;User ID=sa;Password=YourStrongPassword123!;Encrypt=False;
    depends_on:
      - test-sql
