apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
type: Opaque
stringData:
  # Appended port 8081 which is mandatory for the local Cosmos DB Emulator
  cosmos-connection-string: "AccountEndpoint=https://docker.internal;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
  # Updated server names to match the K8s internal service name (mssql-service)
  identity-sql-string: "Server=tcp:mssql-service,1433;Database=IdentityDb;User ID=sa;Password=YourStrong@Password123;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30;"
  payment-sql-string: "Server=tcp:mssql-service,1433;Database=PaymentsDb;User ID=sa;Password=YourStrong@Password123;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30;"
---
# SQL SERVER DATABASE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql-db
  template:
    metadata:
      labels:
        app: mssql-db
    spec:
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2019-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "YourStrong@Password123"
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-service
spec:
  type: ClusterIP
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: mssql-db
---
# CATALOG SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog
        image: ecommerce-catalog:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ConnectionStrings__CosmosDb
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: cosmos-connection-string
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080 # Open in browser at http://localhost:30080
  selector:
    app: catalog-service
---
# IDENTITY SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity
        image: ecommerce-identity:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ConnectionStrings__SqlConnection
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: identity-sql-string
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30085 # Open in browser at http://localhost:30085
  selector:
    app: identity-service
---
# ORDER SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order
        image: ecommerce-order:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ConnectionStrings__CosmosDb
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: cosmos-connection-string
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082 # Open in browser at http://localhost:30082
  selector:
    app: order-service
---
# PAYMENT SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment
        image: ecommerce-payment:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ConnectionStrings__PaymentsDbConnection
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: payment-sql-string
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30083 # Open in browser at http://localhost:30083
  selector:
    app: payment-service